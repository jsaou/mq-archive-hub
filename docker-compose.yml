services:
  postgres:
    image: postgres:16-alpine
    container_name: mqhub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mqarchive}
      POSTGRES_USER: ${DB_USERNAME:-mqarchive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mqarchive}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mqarchive} -d ${DB_NAME:-mqarchive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: mqhub-mq
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: ${MQ_QUEUE_MANAGER:-QM1}
      MQ_APP_PASSWORD: ${MQ_PASSWORD:-passw0rd}
    ports:
      - "${MQ_PORT:-1414}:1414"
      - "${MQ_CONSOLE_PORT:-9443}:9443"
    volumes:
      - mq-data:/mnt/mqm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mqhub-backend
    depends_on:
      postgres:
        condition: service_healthy
      mq:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-mqarchive}
      DB_USERNAME: ${DB_USERNAME:-mqarchive}
      DB_PASSWORD: ${DB_PASSWORD:-mqarchive}
      MQ_QUEUE_MANAGER: ${MQ_QUEUE_MANAGER:-QM1}
      MQ_CHANNEL: ${MQ_CHANNEL:-DEV.APP.SVRCONN}
      MQ_CONN_NAME: mq(1414)
      MQ_USER: ${MQ_USER:-app}
      MQ_PASSWORD: ${MQ_PASSWORD:-passw0rd}
      MQ_QUEUE_NAME: ${MQ_QUEUE_NAME:-DEV.QUEUE.1}
      MQ_DLQ_NAME: ${MQ_DLQ_NAME:-DEV.QUEUE.2}
      MQ_CONCURRENCY: ${MQ_CONCURRENCY:-3-10}
      API_BASE_PATH: ${API_BASE_PATH:-/api/v1}
      API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:-100}
      API_DEFAULT_PAGE_SIZE: ${API_DEFAULT_PAGE_SIZE:-20}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mqhub-frontend
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  mq-data:
