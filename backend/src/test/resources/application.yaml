spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  jms:
    listener:
      auto-startup: false

app:
  mq:
    queue-name: DEV.QUEUE.1
    dlq-name: DEV.QUEUE.2
    concurrency: 1-1
  api:
    base-path: /api/v1
    max-page-size: 100
    default-page-size: 20

