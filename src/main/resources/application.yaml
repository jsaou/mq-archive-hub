spring:
  application:
    name: mq-archive-hub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mqarchive}
    username: ${DB_USERNAME:mqarchive}
    password: ${DB_PASSWORD:mqarchive}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

ibm:
  mq:
    queue-manager: ${MQ_QUEUE_MANAGER:QM1}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    conn-name: ${MQ_CONN_NAME:localhost(1414)}
    user: ${MQ_USER:app}
    password: ${MQ_PASSWORD:passw0rd}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

app:
  mq:
    queue-name: ${MQ_QUEUE_NAME:DEV.QUEUE.1}
